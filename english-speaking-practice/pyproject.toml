[project]
name = "speakflow"
version = "0.1.0"
description = "CLI tool for English speaking practice with AI feedback"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "faster-whisper>=1.0.0",
    "praat-parselmouth>=0.4.4",
    "plotext>=5.2.0",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "anthropic>=0.40.0",
    "yt-dlp>=2024.0.0",
    "scipy>=1.11.0",
]

[project.scripts]
speakflow = "speakflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
