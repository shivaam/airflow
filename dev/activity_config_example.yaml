# Configuration for dev/summarize_user_activity.py
# Copy this file to ~/.airflow-activity.yaml and edit it.
#
# Usage:
#   One-off:  /summarize-activity
#   Scheduled: /loop 2d /summarize-activity

# Your GitHub username
username: "your-github-username"

# Repositories to monitor for your commented issues/PRs
repos:
  - "apache/airflow"
  # - "apache/airflow-client-python"

# Labels to watch for new/updated issues and PRs
labels:
  - "area:core"
  - "area:providers"
  # - "area:scheduler"
  # - "kind:bug"
  # - "kind:feature"

# Apache mailing lists to monitor
mailing_lists:
  - list: "dev"
    domain: "airflow.apache.org"
  - list: "users"
    domain: "airflow.apache.org"

# Only include mailing list threads matching these subject prefixes.
# Leave empty to include all threads.
mailing_list_prefixes:
  - "[DISCUSS]"
  - "[PROPOSAL]"
  - "[VOTE]"
  - "[AIP"
  - "[ANNOUNCE]"
